<div id="dialog-edittempdevice" title="Edit Device">
    <form>
        <table class="display" id="edittable" border="0" cellpadding="0" cellspacing="0">
        <tr>
            <td align="right" style="width:120px">
                <label>Idx: </label>
            </td>
			<td><span id="deviceidx"></span></td>
        </tr>
        <tr>
          <td align="right"><label for="devicename"><span data-i18n="Name">Name</span>: </label></td>
          <td><input type="text" id="devicename" style="width: 250px; padding: .2em;" class="text ui-widget-content ui-corner-all"></td>
        </tr>
		<tr>
			<td align="right"><label for="devicedescription"><span data-i18n="Description"></span>: </label></td>
			<td><textarea id="devicedescription" name="devicedescription" rows="4" style="width: 356px; padding: .2em;" class="text ui-widget-content ui-corner-all"></textarea></td>
		</tr>
        <tr>
          <td align="right"><label for="adjustment"><span data-i18n="Adjustment">Adjustment</span>: </label></td>
          <td><input type="text" id="adjustment" style="width: 40px; padding: .2em;" class="text ui-widget-content ui-corner-all"> &deg; <span id="tempcf">C</span></td>
        </tr>
        <tr>
          <td align="right"><label for="enablebarwidget"><span data-i18n="Enable Bar Widget">Enable Bar Widget</span>: </label></td>
          <td><input type="checkbox" id="enablebarwidget" class="text ui-widget-content ui-corner-all"></td>
        </tr>
        <tr id="barwidgetfields" style="display:none">
          <td colspan="2">
            <table class="display" border="0" cellpadding="0" cellspacing="0" style="margin-left:20px;">
              <tr>
                <td align="right" style="width:100px"><label for="barmin"><span data-i18n="Min Value">Min Value</span>: </label></td>
                <td><input type="text" id="barmin" style="width: 60px; padding: .2em;" class="text ui-widget-content ui-corner-all" value="0"></td>
              </tr>
              <tr>
                <td align="right"><label for="barmax"><span data-i18n="Max Value">Max Value</span>: </label></td>
                <td><input type="text" id="barmax" style="width: 60px; padding: .2em;" class="text ui-widget-content ui-corner-all" value="40"></td>
              </tr>
              <tr>
                <td align="right" style="vertical-align:top"><label for="barranges"><span data-i18n="Ranges">Ranges</span>: </label></td>
                <td>
                  <textarea id="barranges" rows="3" style="width: 250px; padding: .2em;" class="text ui-widget-content ui-corner-all" placeholder="0-10:blue|10-20:green|20-30:yellow|30-40:red"></textarea>
                  <br><small><span data-i18n="Format: min-max:color|min-max:color">Format: min-max:color|min-max:color</span></small>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        </table>
        <div id="setpointfields">
        <table class="display" id="edittable" border="0" cellpadding="0" cellspacing="0">
        <tr>
          <td align="right" style="width:120px"><label for="unit"><span data-i18n="Unit">Unit</span>: </label></td>
          <td><input type="text" id="unit" style="width: 100px; padding: .2em;" class="text ui-widget-content ui-corner-all"></td>
        </tr>
        <tr>
          <td align="right"><label for="step"><span data-i18n="Step">Step</span>: </label></td>
          <td><input type="text" id="step" style="width: 40px; padding: .2em;" class="text ui-widget-content ui-corner-all"></td>
        </tr>
        <tr>
          <td align="right"><label for="min"><span data-i18n="Min">Min</span>: </label></td>
          <td><input type="text" id="min" style="width: 40px; padding: .2em;" class="text ui-widget-content ui-corner-all"></td>
        </tr>
        <tr>
          <td align="right"><label for="max"><span data-i18n="Max">Max</span>: </label></td>
          <td><input type="text" id="max" style="width: 40px; padding: .2em;" class="text ui-widget-content ui-corner-all"></td>
        </tr>
        </table>
        </div>
    </form>
</div>

<div class="container">
<gz-back-to-top></gz-back-to-top>
	<div id="tempcontent"></div>
	<div id="temptophtm">

		<div ng-include="'views/inc_topbar.html'"></div>

  </div>
  <div class="devicesList">
    <div id="tempwidgets" class="row divider">
      <h2 ng-show="ctrl.temperatures.length == 0" data-i18n="No Temperature sensors found or added in the system...">No Temperature sensors found or added in the system...</h2>
      <div ng-repeat-start="t in ctrl.temperatures" class="clearfix" ng-if="$index % 3 == 0 && !$first"></div>
      <dztemperaturewidget ng-repeat-end class="span4 itemBlock" id="{{t.idx}}" item="t" tempsign="config.TempSign" windsign="config.WindSign" ordering="config.AllowWidgetOrdering" dragwidget="DragWidget(idx)" dropwidget="DropWidget(idx)"></dztemperaturewidget>
    </div>
  </div>
</div>
