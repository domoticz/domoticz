<style>
    #uservariablestable { table-layout: fixed; }
    #uservariablestable th,
    #uservariablestable td {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
</style>
<div id="fibaromain" class="container">
	<div class="page-header-small page-header-with-button">
		<h1 data-i18n="User variables">User variables</h1>
        <div><a class="btnstyle3" ng-click="RefreshUserVariablesTable();"><i class="fa fa-refresh" title="Back"></i> <span data-i18n="Refresh">Refresh</span></a></div>
	</div>
    <table class="display" id="uservariablestable" border="0" cellpadding="0" cellspacing="0" width="100%">
        <thead>
            <tr>
                <th align="left">Idx</th>
                <th align="left" data-i18n="Variable name">Variable name</th>
			    <th align="left" data-i18n="Variable type">Variable type</th>
                <th align="left" data-i18n="Current value">Current value</th>
				<th align="left" data-i18n="Last update">Last update</th>
            </tr>
        </thead>
    </table>

    <div class="page-content-container">
        <table class="display" id="uservariablesedittable" border="0" cellpadding="0" cellspacing="20">
            <tr id="uservariablenamerow">
                <td align="right" style="width:110px"><label for="uservariablename"><span data-i18n="Variable name"></span>:</label></td>
                <td colspan="2"><input type="text" id="uservariablename" style="width: 250px; padding: .2em;" class="text ui-widget-content ui-corner-all"></td>
            </tr>
            <tr>
                <td align="right" style="width:110px"><label for="uservariabletype"><span data-i18n="Variable type"></span>:</label></td>
                <td colspan="2"><select id="uservariabletype" style="width:160px" class="combobox ui-corner-all">
                        <option value="0" data-i18n="Integer">Integer</option>
                        <option value="1" data-i18n="Float">Float</option>
                        <option value="2" data-i18n="String">String</option>
                        <option value="3" data-i18n="Date">Date</option>
                        <option value="4" data-i18n="Time">Time</option>
                    </select>
                </td>
            </tr>
            <tr id="uservariablevaluerow">
                <td align="right" style="width:110px; vertical-align: top; padding-top: 4px;"><label for="uservariablevalue"><span data-i18n="Variable value"></span>:</label></td>
                <td colspan="2">
					<textarea id="uservariablevalue" rows="4" style="resize: vertical; width: 100%; padding: .2em;" class="text ui-widget-content ui-corner-all"></textarea>
				</td>
            </tr>
            <tr>
                <td></td>
                <td>
                    <a class="btn btn-info" onclick="AddUpdateVariable('a',0);" data-i18n="Add">Add</a>
                    <a class="btn btn-warning" id="uservariableupdate" data-i18n="Update">Update</a>
                    <a class="btn btn-danger" id="uservariabledelete" data-i18n="Delete">Delete</a>
                </td>
            </tr>	
        </table>
    </div>
</div>
