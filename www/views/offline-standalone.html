<!DOCTYPE HTML>
<html>
<head>
	<meta charset="UTF-8">
	<title>Domoticz Offline</title>
	<meta name="viewport" content="initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
<style>
html, body {
	height: 100%;
	margin: 0;
}

body {
	background: #202020 url(../css/images/img01.jpg) repeat;
	font-family: Arial, Helvetica, sans-serif;
	font-size: 10pt;
	color: #fff;
	display: flex;
	align-items: center;
	justify-content: center;
}

.glass-container {
	padding: 40px 20px;
	text-align: center;
}

.glass-card {
	background: rgba(255, 255, 255, 0.08);
	backdrop-filter: blur(12px);
	-webkit-backdrop-filter: blur(12px);
	border-radius: 20px;
	border: 1px solid rgba(255, 255, 255, 0.1);
	padding: 30px 40px;
	margin: 20px auto;
	max-width: 400px;
	box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
	animation: fadeInUp 0.8s ease-out forwards;
	opacity: 0;
}

@keyframes fadeInUp {
	from {
		opacity: 0;
		transform: translateY(30px);
	}
	to {
		opacity: 1;
		transform: translateY(0);
	}
}

.offline-logo {
	width: 57px;
	height: 57px;
	margin-bottom: 10px;
}

.offline-title {
	font-size: 2em;
	font-weight: 300;
	color: #fff;
	text-shadow: 0 0 30px rgba(100, 200, 255, 0.5);
	margin-bottom: 6px;
	letter-spacing: 3px;
}

.offline-message {
	color: rgba(255, 255, 255, 0.75);
	line-height: 1.6;
	margin: 16px 0 20px;
	font-size: 0.95em;
}

.btn-modern {
	background: linear-gradient(135deg, rgba(100, 200, 255, 0.2), rgba(100, 150, 255, 0.1));
	border: 1px solid rgba(100, 200, 255, 0.4);
	color: #fff;
	padding: 12px 24px;
	border-radius: 12px;
	font-size: 0.95em;
	text-decoration: none;
	display: inline-block;
	transition: all 0.3s ease;
	cursor: pointer;
	width: 100%;
	box-sizing: border-box;
}

.btn-modern:hover {
	background: linear-gradient(135deg, rgba(100, 200, 255, 0.4), rgba(100, 150, 255, 0.3));
	border-color: rgba(100, 200, 255, 0.7);
	transform: translateY(-3px);
	box-shadow: 0 10px 30px rgba(100, 200, 255, 0.3);
	color: #fff;
	text-decoration: none;
}

.domoticz-link {
	display: block;
	text-align: center;
	margin-top: 16px;
	color: rgba(100, 200, 255, 0.6);
	font-size: 0.85em;
	text-decoration: none;
}

.domoticz-link:hover {
	color: rgba(100, 200, 255, 0.9);
}
</style>
</head>
<body>
<div class="glass-container">
	<div class="glass-card">
		<img class="offline-logo" src="../images/logo/57.png" alt="Domoticz">
		<h1 class="offline-title">Domoticz Offline</h1>
		<p class="offline-message">You appear to be offline. Please check your network connection and try again.</p>
		<button class="btn-modern" onclick="location.reload()">Retry</button>
		<a class="domoticz-link" href="http://www.domoticz.com">www.domoticz.com</a>
	</div>
</div>
</body>
</html>
