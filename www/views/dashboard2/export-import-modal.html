<div class="modal-header">
    <button type="button" class="close" ng-click="cancel()">&times;</button>
    <h4 class="modal-title">
        <i class="fa-solid fa-arrow-right-arrow-left" style="margin-right:6px"></i>
        Export / Import Dashboard
    </h4>
</div>

<div class="modal-body db2-eim-body">
    <!-- Top-level tabs: Export / Import -->
    <ul class="nav nav-tabs db2-eim-tabs">
        <li ng-class="{active: tab === 'export'}">
            <a href ng-click="tab = 'export'">
                <i class="fa-solid fa-file-export"></i> Export
            </a>
        </li>
        <li ng-class="{active: tab === 'import'}">
            <a href ng-click="tab = 'import'">
                <i class="fa-solid fa-file-import"></i> Import
            </a>
        </li>
    </ul>

    <!-- EXPORT PANEL -->
    <div ng-show="tab === 'export'" class="db2-eim-panel">
        <!-- Which dashboards -->
        <div class="db2-eim-row">
            <label class="db2-eim-radio">
                <input type="radio" ng-model="exportScope" value="current"> Current dashboard
            </label>
            <label class="db2-eim-radio">
                <input type="radio" ng-model="exportScope" value="all"> All dashboards
            </label>
        </div>

        <!-- Source tabs -->
        <ul class="nav nav-tabs db2-eim-subtabs">
            <li ng-class="{active: exportTab === 'clipboard'}">
                <a href ng-click="exportTab = 'clipboard'; buildExportJson()">
                    <i class="fa-solid fa-clipboard"></i> Clipboard
                </a>
            </li>
            <li ng-class="{active: exportTab === 'download'}">
                <a href ng-click="exportTab = 'download'">
                    <i class="fa-solid fa-download"></i> Download
                </a>
            </li>
        </ul>

        <div class="db2-eim-subpanel">
            <!-- Clipboard -->
            <div ng-show="exportTab === 'clipboard'">
                <textarea class="form-control db2-eim-textarea" readonly
                          ng-model="exportJson"
                          ng-click="$event.target.select()"></textarea>
                <div class="db2-eim-actions">
                    <button class="btn btn-sm"
                            ng-class="copied ? 'btn-success' : 'btn-primary'"
                            ng-click="copyToClipboard()">
                        <i ng-class="copied ? 'fa-solid fa-check' : 'fa-solid fa-copy'"></i>
                        {{ copied ? 'Copied!' : 'Copy to clipboard' }}
                    </button>
                </div>
            </div>
            <!-- Download -->
            <div ng-show="exportTab === 'download'" class="db2-eim-download">
                <i class="fa-solid fa-file-arrow-down" style="font-size:48px;opacity:0.3;display:block;margin-bottom:12px"></i>
                <p style="margin-bottom:12px;opacity:0.7">
                    Downloads <strong>{{ exportScope === 'all' ? 'all dashboards' : activeLayout.name }}</strong> as a <code>.json</code> file
                </p>
                <button class="btn btn-primary" ng-click="downloadFile()">
                    <i class="fa-solid fa-download"></i> Download
                </button>
            </div>
        </div>

        <!-- Watch exportScope to rebuild JSON -->
        <span ng-if="exportTab === 'clipboard'" ng-init="buildExportJson()"></span>
    </div>

    <!-- IMPORT PANEL -->
    <div ng-show="tab === 'import'" class="db2-eim-panel">
        <!-- Source tabs -->
        <ul class="nav nav-tabs db2-eim-subtabs">
            <li ng-class="{active: importTab === 'clipboard'}">
                <a href ng-click="importTab = 'clipboard'">
                    <i class="fa-solid fa-clipboard"></i> Clipboard
                </a>
            </li>
            <li ng-class="{active: importTab === 'file'}">
                <a href ng-click="importTab = 'file'">
                    <i class="fa-solid fa-folder-open"></i> File
                </a>
            </li>
        </ul>

        <div class="db2-eim-subpanel">
            <!-- Clipboard paste -->
            <div ng-show="importTab === 'clipboard'">
                <textarea class="form-control db2-eim-textarea"
                          placeholder="Paste dashboard JSON here..."
                          ng-model="importJson"
                          ng-change="validateImportJson()"></textarea>
            </div>
            <!-- File picker -->
            <div ng-show="importTab === 'file'" class="db2-eim-download">
                <i class="fa-solid fa-file-arrow-up" style="font-size:48px;opacity:0.3;display:block;margin-bottom:12px"></i>
                <button class="btn btn-default" ng-click="triggerFilePick()">
                    <i class="fa-solid fa-folder-open"></i> Select a file to import
                </button>
                <input type="file" id="db2-eim-file" accept=".json" style="display:none"
                       db2-file-import="onFileSelected($file)">
                <div ng-show="selectedFileName" class="db2-eim-filename">
                    <i class="fa-solid fa-file"></i> {{ selectedFileName }}
                </div>
            </div>
        </div>

        <!-- Build version warning -->
        <div class="alert alert-warning db2-eim-warning" ng-show="versionWarning">
            <i class="fa-solid fa-triangle-exclamation"></i> {{ versionWarning }}
        </div>

        <!-- Validation error -->
        <div class="alert alert-danger db2-eim-warning" ng-show="importError">
            <i class="fa-solid fa-circle-exclamation"></i> {{ importError }}
        </div>

        <!-- Import target -->
        <div class="db2-eim-row db2-eim-target-row">
            <span class="db2-eim-target-label">Import to:</span>
            <label class="db2-eim-radio">
                <input type="radio" ng-model="importTarget" value="new"> New dashboard
            </label>
            <label class="db2-eim-radio">
                <input type="radio" ng-model="importTarget" value="replace"> Replace current
            </label>
        </div>
    </div>
</div>

<div class="modal-footer">
    <button type="button" class="btn btn-default" ng-click="cancel()">Cancel</button>
    <button type="button" class="btn btn-primary"
            ng-show="tab === 'import'"
            ng-disabled="!canImport()"
            ng-click="doImport()">
        <i class="fa-solid fa-file-import"></i> Import
    </button>
</div>
