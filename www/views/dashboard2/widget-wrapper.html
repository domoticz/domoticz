<div class="db2-widget"
     ng-class="['db2-widget--' + ctrl.widgetDef.type, {'db2-widget--error': ctrl.error, 'db2-widget--loading': ctrl.loading}]"
     role="article"
     aria-label="{{ (ctrl.descriptor && ctrl.descriptor.label || ctrl.widgetDef.type) + ': ' + (ctrl.widgetDef.config.title || '') }}"
     tabindex="{{ editMode ? 0 : -1 }}">

    <!-- Widget header — only visible in edit mode (drag handle + actions) -->
    <div class="db2-widget-header"
         ng-show="editMode"
         ng-class="{'db2-widget-drag-handle': editMode}">

        <span class="db2-widget-icon"
              ng-class="ctrl.descriptor.icon"
              ng-show="ctrl.descriptor && ctrl.descriptor.icon"></span>

        <span class="db2-widget-title"
              ng-bind="ctrl.widgetDef.config.title || (ctrl.descriptor && ctrl.descriptor.label) || ctrl.widgetDef.type"></span>

        <!-- Edit mode action buttons: stopPropagation prevents GridStack drag from intercepting clicks -->
        <div class="db2-widget-actions" ng-show="editMode"
             ng-mousedown="$event.stopPropagation()">
            <button class="btn btn-xs db2-widget-btn" title="Configure widget"
                    ng-show="ctrl.descriptor && ctrl.descriptor.configSchema && ctrl.descriptor.configSchema.length"
                    ng-click="onConfigure()">
                <i class="fa-solid fa-gear"></i>
            </button>
            <button class="btn btn-xs db2-widget-btn" title="Duplicate widget"
                    ng-click="onClone()">
                <i class="fa-solid fa-copy"></i>
            </button>
            <button class="btn btn-xs db2-widget-btn db2-widget-btn--remove" title="Remove widget"
                    ng-click="onRemove()">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
    </div>

    <!-- Error state -->
    <div class="db2-widget-error" ng-show="ctrl.error">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <span ng-bind="ctrl.error"></span>
    </div>

    <!-- Skeleton loader shown while widget data is loading -->
    <div class="db2-skeleton" ng-show="ctrl.loading" aria-hidden="true"></div>

    <!-- Widget content — dynamically compiled by db2WidgetContent -->
    <div class="db2-widget-body" ng-hide="ctrl.error || ctrl.loading">
        <div db2-widget-content
             widget-def="ctrl.widgetDef"
             edit-mode="editMode"></div>
    </div>
</div>
