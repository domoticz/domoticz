<div class="db2-chart-container">
    <div ng-if="ctrl.isEmpty" class="db2-chart-unconfigured">
        <i class="fa-solid fa-chart-line"></i>
        <p>Select devices in settings to display a chart</p>
    </div>
    <div ng-if="ctrl.error" class="db2-chart-unconfigured">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <p>{{ ctrl.error }}</p>
    </div>
    <div ng-if="!ctrl.isEmpty && !ctrl.error" class="db2-chart-wrap">
        <div id="{{ ctrl.chartId }}" class="db2-highchart"></div>
    </div>
</div>
