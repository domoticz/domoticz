<div class="db2-quick-actions">
    <button class="db2-qa-btn"
            ng-repeat="action in ctrl.actions"
            ng-click="ctrl.execute(action)"
            ng-disabled="ctrl.busy[action.idx]"
            ng-class="{
                'db2-qa-btn--scene':   action.type === 'scene',
                'db2-qa-btn--switch':  action.type !== 'scene',
                'db2-qa-btn--success': ctrl.success[action.idx],
                'db2-qa-btn--error':   ctrl.error[action.idx]
            }"
            title="{{ action.label }}">
        <i ng-class="action.icon || 'fa-solid fa-play'"></i>
        <span class="db2-qa-label" ng-bind="action.label"></span>
    </button>
    <div class="db2-qa-empty"
         ng-show="ctrl.actions.length === 0">
        <i class="fa-solid fa-bolt" style="opacity:0.3;font-size:24px"></i>
        <p>Configure actions in widget settings</p>
    </div>
</div>
