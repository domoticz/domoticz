<div class="db2-stat-card">

    <!-- Unconfigured state -->
    <div ng-if="!ctrl.configured" class="db2-chart-unconfigured">
        <i class="fa-solid fa-battery-half"></i>
        <p>Configure Battery Status in settings</p>
    </div>

    <!-- Configured state -->
    <div ng-if="ctrl.configured" style="width:100%;">
        <div class="db2-stat-label" ng-bind="ctrl.title"></div>

        <div style="display:flex;gap:16px;justify-content:center;align-items:flex-start;margin-top:4px;">

            <!-- Today totals: import, export, net -->
            <div ng-if="ctrl.battery">
                <div class="db2-stat-line db2-energy-import">
                    <i class="fa fa-arrow-circle-down"></i>
                    {{ctrl.battery.importedKwh | number:2}} kWh
                </div>
                <div class="db2-stat-line db2-energy-export">
                    <i class="fa fa-arrow-circle-up"></i>
                    {{ctrl.battery.exportedKwh | number:2}} kWh
                </div>
                <div class="db2-stat-sub">
                    {{'Net' | translate}}:
                    <span ng-class="ctrl.netClass()">
                        {{ctrl.netKwh() >= 0 ? '+' : ''}}{{ctrl.netKwh() | number:2}} kWh
                    </span>
                </div>
            </div>
            <div ng-if="!ctrl.battery" class="db2-stat-sub" style="align-self:center;">
                &mdash;
            </div>

            <!-- Live data: SOC, watts, voltage -->
            <div ng-if="ctrl.batteryLive">
                <div class="db2-stat-line"
                     ng-if="ctrl.batteryLive.soc"
                     ng-style="{'color':'var(--dz-widget-energy-export)'}">
                    <i class="fa fa-battery-three-quarters"></i>
                    {{ctrl.batteryLive.soc}}
                </div>
                <div class="db2-stat-line"
                     ng-if="ctrl.batteryLive.watt"
                     ng-style="{'color':'var(--dz-widget-energy-battery)'}">
                    <i class="fa fa-bolt"></i>
                    {{ctrl.batteryLive.watt}}
                </div>
                <div class="db2-stat-line"
                     ng-if="ctrl.batteryLive.voltage"
                     ng-style="{'color':'var(--dz-widget-energy-import)'}">
                    <i class="fa fa-plug"></i>
                    {{ctrl.batteryLive.voltage}}
                </div>
            </div>

        </div>

        <div ng-if="!ctrl.battery && !ctrl.batteryLive" class="db2-stat-value" style="margin-top:8px;">
            &mdash;
        </div>
    </div>

</div>
