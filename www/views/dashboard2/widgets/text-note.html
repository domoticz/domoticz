<div class="db2-text-note" ng-style="ctrl.getStyle()">
    <span ng-bind="(ctrl.widgetDef.config.content) || (ctrl.editMode ? '' : 'Double-click to edit in settings')"></span>
    <span class="db2-text-note-hint"
          ng-show="ctrl.editMode && !ctrl.widgetDef.config.content">
        <i class="fa-solid fa-pencil"></i>
        Configure text in widget settings
    </span>
</div>
