<div class="db2-text-sensor">
    <!-- Unconfigured state -->
    <div ng-if="!ctrl.widgetDef.config.deviceIdx" class="db2-chart-unconfigured">
        <i class="fa-solid fa-align-left"></i>
        <p>Select a device in settings</p>
    </div>

    <!-- Loaded state -->
    <div ng-if="ctrl.widgetDef.config.deviceIdx" class="db2-text-sensor-inner">
        <div class="db2-text-sensor-title" ng-show="ctrl.showTitle" ng-bind="ctrl.deviceName"></div>
        <div class="db2-text-sensor-content" ng-style="{'font-size': ctrl.fontSize + 'px'}">
            {{ ctrl.text }}
        </div>
        <div class="db2-text-sensor-updated" ng-bind="ctrl.lastUpdate"></div>
    </div>
</div>
