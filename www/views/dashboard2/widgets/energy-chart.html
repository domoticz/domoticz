<div class="db2-chart-container">
    <div ng-if="!ctrl.widgetDef.config.deviceIdx" class="db2-chart-unconfigured">
        <i class="fa-solid fa-bolt"></i>
        <p>Select an energy device in settings</p>
    </div>
    <div ng-if="ctrl.widgetDef.config.deviceIdx" class="db2-chart-wrap">
        <div class="db2-chart-title" ng-show="ctrl.deviceName" ng-bind="ctrl.deviceName"></div>
        <div id="{{ ctrl.chartId }}" class="db2-highchart"></div>
    </div>
</div>
