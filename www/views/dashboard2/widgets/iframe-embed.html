<div class="db2-iframe-container">

    <!-- Unconfigured state -->
    <div class="db2-iframe-placeholder"
         ng-show="!ctrl.trustedUrl && !ctrl.widgetDef.config.url">
        <i class="fa-solid fa-globe" style="font-size:36px;opacity:0.3"></i>
        <p>Configure a URL in widget settings</p>
    </div>

    <!-- Invalid URL -->
    <div class="db2-iframe-placeholder db2-iframe-error-state"
         ng-show="ctrl.urlError">
        <i class="fa-solid fa-ban" style="font-size:36px;opacity:0.5"></i>
        <p>Invalid URL — only http:// and https:// are allowed</p>
    </div>

    <!-- Script warning -->
    <div class="alert alert-warning db2-iframe-script-warning"
         ng-show="ctrl.trustedUrl && ctrl.widgetDef.config.allowScripts">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <strong>Script execution enabled.</strong> Only embed trusted content.
    </div>

    <!-- The iframe -->
    <iframe ng-show="ctrl.trustedUrl"
            ng-src="{{ ctrl.trustedUrl }}"
            class="db2-iframe"
            ng-attr-sandbox="{{ ctrl.sandboxAttr }}"
            referrerpolicy="no-referrer"
            loading="lazy"
            title="{{ ctrl.widgetDef.config.title || 'Embedded content' }}"
            frameborder="0">
    </iframe>

</div>
