<div class="item span4 itemBlock" ng-class="ctrl.getBackgroundClass()" id="{{ctrl.device.idx}}">
    <section>
        <table id="itemtable" border="0" cellpadding="0" cellspacing="0">
            <tr>
                <td id="name" class="item-name" data-idx="{{ctrl.device.idx}}" data-desc="{{ctrl.device.Description}}" data-search="{{ctrl.searchText}}">{{ctrl.device.Name}}</td>
                <td id="bigtext">{{ctrl.getBigText()}}</td>
                <td id="img" ng-hide="ctrl.isText() && ctrl.hideTextIcon()">
                    <a ng-if="ctrl.device.SubType === 'Sound Level'"
                       ng-href="#/Devices/{{ctrl.device.idx}}/Log">
                        <dz-device-icon class="dz-icon-48 lcursor"
                                        device="ctrl.device"
                                        fallback-src="ctrl.getDeviceIcon()"
                                        use-glyph="!ctrl.isValueDrivenIcon()"></dz-device-icon>
                    </a>
                    <dz-device-icon ng-if="!ctrl.isSetpoint() && ctrl.device.Type !== 'Radiator 1' && ctrl.device.SubType !== 'Sound Level'"
                                    class="dz-icon-48"
                                    device="ctrl.device"
                                    fallback-src="ctrl.getDeviceIcon()"
                                    use-glyph="!ctrl.isValueDrivenIcon()"></dz-device-icon>
                    <dz-device-icon ng-if="ctrl.isSetpoint() || ctrl.device.Type === 'Radiator 1'"
                                    class="dz-icon-48 lcursor"
                                    device="ctrl.device"
                                    fallback-src="ctrl.getDeviceIcon()"
                                    use-glyph="!ctrl.isValueDrivenIcon()"
                                    ng-click="ctrl.showSetpointPopup($event)"></dz-device-icon>
                </td>
                <td id="status" ng-bind-html="ctrl.getStatusText()"></td>
                <td id="lastupdate" ng-class="{'lastupdate-spaced': ctrl.isText() && ctrl.hideTextIcon()}">
                    <dz-bar value="ctrl.barNumVal" ranges="ctrl.barRanges"></dz-bar>
                    <span data-i18n="Last Seen" style="font-style: italic">Last Seen</span>: {{ctrl.device.LastUpdate}}
                </td>
                <td id="type">{{ctrl.getTypeSubTypeText()}}</td>
                <td class="options">
                    <span ng-if="ctrl.device.Favorite == 0"><i class="dz-icon-glyph dz-icon-16 fa-regular fa-star lcursor" data-i18n="[title]Add to Dashboard" ng-click="ctrl.makeFavorite(1)"></i>&nbsp;&nbsp;&nbsp;&nbsp;</span>
                    <span ng-if="ctrl.device.Favorite != 0"><i class="dz-icon-glyph dz-icon-16 fa-solid fa-star lcursor" data-i18n="[title]Remove from Dashboard" ng-click="ctrl.makeFavorite(0)"></i>&nbsp;&nbsp;&nbsp;&nbsp;</span>
                    <a ng-if="ctrl.hasLogLink()" class="btnsmall" ng-href="{{ctrl.getGraphLogLink()}}" data-i18n="Log">Log</a>
                    <a ng-if="ctrl.isAdmin" class="btnsmall" ng-click="ctrl.editDevice()" data-i18n="Edit">Edit</a>
                    <a ng-if="ctrl.isAdmin && ctrl.hasTimerSupport() && ctrl.hasTimers()" class="btnsmall-sel" ng-href="{{ctrl.getTimerLink()}}" data-i18n="Timers">Timers</a>
                    <a ng-if="ctrl.isAdmin && ctrl.hasTimerSupport() && !ctrl.hasTimers()" class="btnsmall" ng-href="{{ctrl.getTimerLink()}}" data-i18n="Timers">Timers</a>
                    <a ng-if="ctrl.isAdmin && ctrl.showNotifications() && ctrl.hasNotifications()" class="btnsmall-sel" ng-href="{{ctrl.getNotificationLink()}}" data-i18n="Notifications">Notifications</a>
                    <a ng-if="ctrl.isAdmin && ctrl.showNotifications() && !ctrl.hasNotifications()" class="btnsmall" ng-href="{{ctrl.getNotificationLink()}}" data-i18n="Notifications">Notifications</a>
                </td>
            </tr>
        </table>
    </section>
</div>
