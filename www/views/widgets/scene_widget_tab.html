<div class="item span4 itemBlock" ng-class="ctrl.getBackgroundClass()" id="{{ctrl.scene.idx}}">
    <section>
        <table ng-attr-id="{{ctrl.isScene() ? 'itemtablenostatus' : 'itemtabledoubleicon'}}" border="0" cellpadding="0" cellspacing="0">
            <tr>
                <td id="name" class="item-name" data-idx="{{ctrl.scene.idx}}" data-desc="{{ctrl.scene.Description}}" data-search="{{ctrl.searchText}}">{{ctrl.scene.Name}}</td>
                <td id="bigtext">
                    {{ctrl.getStatusText()}}
                    <a ng-if="ctrl.scene.UsedByCamera" ng-click="ctrl.showCameraStream()" class="lcursor">
                        <i class="dz-icon-glyph dz-icon-16 fa-solid fa-video" title="Stream Video"></i>
                    </a>
                </td>
                <!-- Scene: single Activate button -->
                <td ng-if="ctrl.isScene()" id="img1">
                    <i class="dz-icon-glyph dz-icon-48 lcursor fa-solid fa-play dz-scene-run" ng-click="ctrl.switchOn()" title="Activate scene"></i>
                </td>
                <!-- Group: On push button -->
                <td ng-if="ctrl.isGroup()" id="img1">
                    <i class="dz-icon-glyph dz-icon-48 lcursor fa-solid fa-power-off dz-scene-on" ng-click="ctrl.switchOn()" ng-class="{'transimg': ctrl.isOn()}" title="Turn On"></i>
                </td>
                <!-- Group: Off push button -->
                <td ng-if="ctrl.isGroup()" id="img2">
                    <i class="dz-icon-glyph dz-icon-48 lcursor fa-solid fa-power-off dz-scene-off" ng-click="ctrl.switchOff()" ng-class="{'transimg': ctrl.scene.Status === 'Off' || ctrl.scene.Status === 'Group Off'}" title="Turn Off"></i>
                </td>
                <td id="status">&nbsp;</td>
                <td id="lastupdate" class="lastupdate"><span data-i18n="Last Seen" style="font-style: italic">Last Seen</span>: {{ctrl.scene.LastUpdate}}</td>
                <td id="type">{{ctrl.getTypeText()}}</td>
                <td class="options">
                    <span ng-if="ctrl.scene.Favorite == 0"><i class="dz-icon-glyph dz-icon-16 fa-regular fa-star lcursor" title="Add to Dashboard" ng-click="ctrl.makeFavorite(1)"></i>&nbsp;&nbsp;&nbsp;&nbsp;</span>
                    <span ng-if="ctrl.scene.Favorite != 0"><i class="dz-icon-glyph dz-icon-16 fa-solid fa-star lcursor" title="Remove from Dashboard" ng-click="ctrl.makeFavorite(0)"></i>&nbsp;&nbsp;&nbsp;&nbsp;</span>
                    <a class="btnsmall" href="#/Scenes/{{ctrl.scene.idx}}/Log" data-i18n="Log">Log</a>
                    <a ng-if="ctrl.isAdmin" class="btnsmall" ng-click="ctrl.editScene()" data-i18n="Edit">Edit</a>
                    <a ng-if="ctrl.isAdmin && ctrl.hasTimers()" class="btnsmall-sel" href="#/Scenes/{{ctrl.scene.idx}}/Timers" data-i18n="Timers">Timers</a>
                    <a ng-if="ctrl.isAdmin && !ctrl.hasTimers()" class="btnsmall" href="#/Scenes/{{ctrl.scene.idx}}/Timers" data-i18n="Timers">Timers</a>
                </td>
            </tr>
        </table>
    </section>
</div>
