<div class="dd-dz-favorites">

    <div class="dd-dz-unconfigured" ng-show="ctrl.loading && !ctrl.categories.length">
        <i class="fa-solid fa-rotate fa-spin" style="font-size:24px;opacity:0.4"></i>
        <p>Loading&hellip;</p>
    </div>

    <div class="dd-dz-unconfigured" ng-show="ctrl.error">
        <i class="fa-solid fa-triangle-exclamation" style="font-size:24px;opacity:0.4"></i>
        <p ng-bind="ctrl.error"></p>
    </div>

    <div ng-show="!ctrl.error && (!ctrl.loading || ctrl.categories.length)" class="dd-favorites-main">

        <!-- Category tab strip — only shown when multiple categories are present and showTabs is enabled -->
        <div class="dd-cat-tabs" ng-show="ctrl.showTabs()">
            <button class="dd-cat-tab"
                    ng-repeat="cat in ctrl.categories track by cat.key"
                    ng-class="{ 'dd-cat-tab--active': ctrl.activeCategory === cat.key }"
                    ng-click="ctrl.activeCategory = cat.key">
                <i class="dz-icon-glyph dz-icon-16" ng-class="cat.icon"></i>
                {{ cat.label }}
                <span class="dd-cat-badge">{{ cat.devices.length }}</span>
            </button>
        </div>

        <!-- Device list for the active category -->
        <div class="dd-dz-favorites-body">
            <div ng-repeat="device in ctrl.activeDevices track by device.idx" class="dd-dz-fav-item">
                <dz-light-widget
                    ng-if="ctrl.isLight(device)"
                    device="device"
                    dashboard-type="0">
                </dz-light-widget>
                <!-- Scene / Group inline rendering — same structure as dz-scene-widget but
                     dd-fav-scene-wrap on the inner div lets dashboard.css override the
                     10px bottom-margin on the floated icon cell that made scenes taller. -->
                <div ng-if="ctrl.isScene(device)" class="span4">
                    <div class="item itemBlock statusNormal dd-fav-scene-wrap">
                        <table ng-attr-id="{{ ctrl.isGroup(device) ? 'itemtablesmalldoubleicon' : 'itemtablesmall' }}"
                               border="0" cellpadding="0" cellspacing="0">
                            <tr>
                                <td id="name" class="item-name" ng-bind="device.Name"></td>
                                <td id="bigtext">{{ ctrl.isGroup(device) ? device.Status : '' }}</td>
                                <!-- Scene/group run/on/off: classic Push48 image (dz-classic-only) or
                                     Font Awesome glyph (dz-glyph-only), per the icon-style toggle. -->
                                <td id="img1">
                                    <i ng-if="!ctrl.isGroup(device)"
                                       class="dz-icon-glyph dz-icon-40 lcursor fa-solid fa-play dz-scene-run dz-glyph-only"
                                       ng-click="ctrl.activateScene(device, 'On')" title="Activate"></i>
                                    <img ng-if="!ctrl.isGroup(device)" class="dz-classic-only lcursor"
                                         src="images/Push48_On.png" ng-click="ctrl.activateScene(device, 'On')"
                                         height="40" width="40" title="Activate">
                                    <i ng-if="ctrl.isGroup(device)"
                                       class="dz-icon-glyph dz-icon-40 lcursor fa-solid fa-power-off dz-scene-on dz-glyph-only"
                                       ng-click="ctrl.activateScene(device, 'On')"
                                       ng-class="{'transimg': device.Status === 'On' || device.Status === 'Group On'}"
                                       title="Turn On"></i>
                                    <img ng-if="ctrl.isGroup(device)" class="dz-classic-only lcursor"
                                         src="images/Push48_On.png" ng-click="ctrl.activateScene(device, 'On')"
                                         ng-class="{'transimg': device.Status === 'On' || device.Status === 'Group On'}"
                                         height="40" width="40" title="Turn On">
                                </td>
                                <td ng-if="ctrl.isGroup(device)" id="img2">
                                    <i class="dz-icon-glyph dz-icon-40 lcursor fa-solid fa-power-off dz-scene-off dz-glyph-only"
                                       ng-click="ctrl.activateScene(device, 'Off')"
                                       ng-class="{'transimg': device.Status === 'Off' || device.Status === 'Group Off'}"
                                       title="Turn Off"></i>
                                    <img class="dz-classic-only lcursor" src="images/Push48_Off.png"
                                         ng-click="ctrl.activateScene(device, 'Off')"
                                         ng-class="{'transimg': device.Status === 'Off' || device.Status === 'Group Off'}"
                                         height="40" width="40" title="Turn Off">
                                </td>
                                <td id="status">
                                    <span ng-if="!ctrl.isGroup(device)" data-i18n="Scene">Scene</span>
                                    <span ng-if="ctrl.isGroup(device)" data-i18n="Group">Group</span>
                                </td>
                                <td id="lastupdate">
                                    <span data-i18n="Last Seen" style="font-style:italic">Last Seen</span>: {{ device.LastUpdate }}
                                </td>
                            </tr>
                        </table>
                    </div>
                </div>
                <!-- Barometer / Temp+Baro / Temp+Hum+Baro — weather tab only.
                     Mirrors weather_widget.html using #itemtablenotype so the
                     barometer value and forecast appear instead of temperature. -->
                <div ng-if="ctrl.isBaro(device)" class="span4">
                    <div class="item itemBlock statusNormal">
                        <table id="itemtablesmall" border="0" cellpadding="0" cellspacing="0">
                            <tr>
                                <td id="name" class="item-name" ng-bind="device.Name"></td>
                                <td id="bigtext">{{ device.Barometer }} hPa</td>
                                <td id="img">
                                    <a ng-href="#/Devices/{{ device.idx }}/Log">
                                        <dz-device-icon class="dz-icon-48 lcursor"
                                                        device="device"
                                                        fallback-src="'images/baro48.png'"
                                                        use-glyph="false"></dz-device-icon>
                                    </a>
                                </td>
                                <td id="status">
                                    <span ng-if="device.ForecastStr">
                                        <span data-i18n="Prediction">Prediction</span>: {{ device.ForecastStr }}
                                    </span>
                                    <span ng-if="device.Temp !== undefined">
                                        , <span data-i18n="Temp">Temp</span>: {{ device.Temp }}&deg;
                                    </span>
                                </td>
                                <td id="lastupdate">
                                    <span data-i18n="Last Seen" style="font-style:italic">Last Seen</span>: {{ device.LastUpdate }}
                                </td>
                            </tr>
                        </table>
                    </div>
                </div>
                <dz-utility-widget
                    ng-if="!ctrl.isLight(device) && !ctrl.isScene(device) && !ctrl.isBaro(device)"
                    device="device"
                    dashboard-type="0">
                </dz-utility-widget>
            </div>
            <div class="dd-dz-unconfigured"
                 ng-show="!ctrl.loading && ctrl.categories.length && !ctrl.activeDevices.length">
                <p>No devices in this category</p>
            </div>
            <div class="dd-dz-unconfigured"
                 ng-show="!ctrl.loading && !ctrl.categories.length">
                <i class="fa-regular fa-star" style="font-size:28px;opacity:0.3"></i>
                <p>No favorite devices found</p>
            </div>
        </div>
    </div>

</div>
