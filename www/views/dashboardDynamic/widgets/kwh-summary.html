<div class="dd-stat-card dd-stat-card-full"
     ng-class="{'dd-stat-card--no-bg': ctrl.widgetDef.config.showBackground === false && !ctrl.editMode}">
    <!-- Unconfigured state -->
    <div ng-if="!ctrl.widgetDef.config.deviceIdx" class="dd-chart-unconfigured">
        <i class="fa-solid fa-solar-panel"></i>
        <p>Select a device in settings</p>
    </div>

    <!-- Loaded state -->
    <div ng-if="ctrl.widgetDef.config.deviceIdx" style="width:100%">
        <div class="dd-stat-label" ng-bind="ctrl.title"></div>

        <a ng-if="ctrl.usageWatt !== null" class="dd-stat-link"
           ng-href="#/Devices/{{ctrl.widgetDef.config.deviceIdx}}/Log">
            <div class="dd-stat-value" ng-class="ctrl.colorClass()">
                <i class="fa fa-bolt"></i> {{ctrl.usageWatt}} W
            </div>
        </a>
        <div ng-if="ctrl.usageWatt === null" class="dd-stat-value">
            &mdash;
        </div>

        <div ng-if="ctrl.counterToday !== null" class="dd-stat-sub">
            Today: {{ctrl.counterToday}}
        </div>

        <dd-stat-bar num-val="ctrl.numVal" ranges="ctrl.widgetDef.config.ranges"></dd-stat-bar>
    </div>
</div>
