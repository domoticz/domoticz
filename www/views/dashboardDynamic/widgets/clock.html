<div class="dd-stat-card dd-stat-card-full"
     ng-class="{'dd-stat-card--no-bg': ctrl.widgetDef.config.showBackground === false && !ctrl.editMode}">
    <div class="dd-clock-title" ng-if="ctrl.title" ng-bind="ctrl.title"></div>
    <div class="dd-clock-time" ng-bind="ctrl.timeStr"></div>
    <div class="dd-clock-date" ng-bind="ctrl.dateStr" ng-show="ctrl.dateStr"></div>
</div>
