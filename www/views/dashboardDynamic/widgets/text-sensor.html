<div class="dd-text-sensor">
    <!-- Unconfigured state -->
    <div ng-if="!ctrl.widgetDef.config.deviceIdx" class="dd-chart-unconfigured">
        <i class="fa-solid fa-align-left"></i>
        <p>Select a device in settings</p>
    </div>

    <!-- Loaded state -->
    <div ng-if="ctrl.widgetDef.config.deviceIdx" class="dd-text-sensor-inner">
        <div class="dd-text-sensor-header" ng-show="ctrl.showTitle || ctrl.lastUpdate">
            <span class="dd-text-sensor-title" ng-show="ctrl.showTitle" ng-bind="ctrl.deviceName"></span>
            <span class="dd-text-sensor-updated" ng-bind="ctrl.lastUpdate"></span>
        </div>
        <div class="dd-text-sensor-content" ng-style="{'font-size': ctrl.fontSize + 'px'}" ng-bind-html="ctrl.text"></div>
    </div>
</div>
