<div class="dd-stat-card dd-setpoint dd-stat-card-full"
     ng-class="{'dd-stat-card--no-bg': ctrl.widgetDef.config.showBackground === false && !ctrl.editMode}">

    <!-- Unconfigured state -->
    <div ng-if="!ctrl.widgetDef.config.deviceIdx"
         class="dd-chart-unconfigured">
        <i class="fa-solid fa-thermometer"></i>
        <p>Select a Thermostat6 device in settings</p>
    </div>

    <!-- Configured state -->
    <div ng-if="ctrl.widgetDef.config.deviceIdx"
         style="width:100%;text-align:center;">

        <!-- Title -->
        <div class="dd-stat-label" ng-bind="ctrl.title"></div>

        <!-- Load error -->
        <div ng-if="ctrl.loadError"
             style="font-size:1.4em;margin:8px 0;color:var(--dz-status-timeout);">
            <i class="fa fa-exclamation-triangle"></i>
        </div>

        <!-- Temperature + Humidity row -->
        <div ng-if="!ctrl.loadError && (ctrl.temp !== null || ctrl.humidity !== null)"
             style="display:flex;align-items:baseline;justify-content:center;gap:16px;
                    margin-bottom:4px;">

            <span ng-if="ctrl.temp !== null"
                  style="font-size:2.2em;font-weight:bold;line-height:1.1;
                         color:var(--dz-widget-accent);">
                {{ctrl.temp}}
                <span style="font-size:0.55em;font-weight:normal;">°C</span>
            </span>

            <span ng-if="ctrl.humidity !== null"
                  style="font-size:1.4em;font-weight:bold;
                         color:var(--dz-widget-stat-muted);">
                {{ctrl.humidity}}%
            </span>

        </div>

        <!-- Barometer + Humidity status row -->
        <div ng-if="!ctrl.loadError && (ctrl.barometer !== null || ctrl.humidityStatus !== null)"
             style="font-size:0.9em;color:var(--dz-widget-stat-muted);
                    margin-bottom:8px;display:flex;align-items:center;
                    justify-content:center;gap:10px;">

            <span ng-if="ctrl.barometer !== null">
                {{ctrl.barometer}} hPa
            </span>

            <span ng-if="ctrl.humidityStatus !== null"
                  ng-bind="ctrl.humidityStatus">
            </span>

        </div>

        <!-- Setpoint controls row -->
        <div ng-if="!ctrl.loadError"
             class="dd-setpoint-controls"
             style="justify-content:center;">

            <!-- Decrement button -->
            <button class="dd-setpoint-btn"
                    ng-click="ctrl.decrement()"
                    ng-disabled="ctrl.atMin() || ctrl.sending || ctrl.setpoint === null"
                    title="Decrease">
                <i class="fa fa-minus"></i>
            </button>

            <!-- Setpoint value — click to edit -->
            <span class="dd-setpoint-value"
                  ng-if="ctrl.setpoint !== null"
                  ng-click="ctrl.clickToEdit($event)"
                  title="Click to edit">
                {{ctrl.setpoint}} °C
            </span>
            <span class="dd-setpoint-value"
                  ng-if="ctrl.setpoint === null">
                &mdash;
            </span>

            <!-- Increment button -->
            <button class="dd-setpoint-btn"
                    ng-click="ctrl.increment()"
                    ng-disabled="ctrl.atMax() || ctrl.sending || ctrl.setpoint === null"
                    title="Increase">
                <i class="fa fa-plus"></i>
            </button>

        </div>

        <!-- Hint text -->
        <div ng-if="ctrl.setpoint !== null && !ctrl.loadError"
             style="font-size:0.72em;color:var(--dz-widget-stat-muted);margin-top:4px;">
            click setpoint to edit
        </div>

    </div>

</div>
