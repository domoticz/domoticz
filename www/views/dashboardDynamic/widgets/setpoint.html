<div class="dd-stat-card dd-setpoint">

    <!-- Unconfigured state -->
    <div ng-if="!ctrl.widgetDef.config.deviceIdx" class="dd-chart-unconfigured">
        <i class="fa-solid fa-sliders"></i>
        <p>Select a device in settings</p>
    </div>

    <!-- Configured state -->
    <div ng-if="ctrl.widgetDef.config.deviceIdx" style="width:100%;text-align:center;">

        <!-- Title -->
        <div class="dd-stat-label" ng-bind="ctrl.title"></div>

        <!-- Controls row -->
        <div class="dd-setpoint-controls">

            <!-- Decrement button -->
            <button class="dd-setpoint-btn"
                    ng-click="ctrl.decrement()"
                    ng-disabled="ctrl.atMin() || ctrl.sending || ctrl.value === null"
                    title="Decrease">
                <i class="fa fa-minus"></i>
            </button>

            <!-- Value display — click to edit -->
            <span class="dd-setpoint-value"
                  ng-if="ctrl.value !== null"
                  ng-click="ctrl.clickToEdit($event)"
                  title="Click to edit">
                {{ctrl.value}} {{ctrl.deviceUnit}}
            </span>
            <span class="dd-setpoint-value"
                  ng-if="ctrl.value === null && !ctrl.loadError">
                &mdash;
            </span>
            <span class="dd-setpoint-value"
                  ng-if="ctrl.loadError"
                  style="font-size:0.9em;color:var(--dz-status-timeout);">
                <i class="fa fa-exclamation-triangle"></i>
            </span>

            <!-- Increment button -->
            <button class="dd-setpoint-btn"
                    ng-click="ctrl.increment()"
                    ng-disabled="ctrl.atMax() || ctrl.sending || ctrl.value === null"
                    title="Increase">
                <i class="fa fa-plus"></i>
            </button>

        </div>

        <!-- Hint text -->
        <div ng-if="ctrl.value !== null"
             style="font-size:0.72em;color:var(--dz-widget-stat-muted);margin-top:4px;">
            click value to edit
        </div>

    </div>

</div>
