<div class="dd-stat-counter">
    <div ng-if="!ctrl.widgetDef.config.deviceIdx" class="dd-chart-unconfigured">
        <i class="fa-solid fa-gauge"></i>
        <p>Select a device in settings</p>
    </div>
    <div ng-if="ctrl.widgetDef.config.deviceIdx" class="dd-stat">
        <div class="dd-stat-label" ng-bind="ctrl.label"></div>
        <div class="dd-stat-value-row">
            <span class="dd-stat-value" ng-bind="ctrl.value"></span><span class="dd-stat-unit" ng-if="ctrl.unit">&thinsp;{{ ctrl.unit }}</span>
        </div>
    </div>
</div>
