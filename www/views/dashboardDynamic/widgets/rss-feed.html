<div class="dd-rss dd-stat-card-full"
     ng-class="{'dd-stat-card--no-bg': ctrl.widgetDef.config.showBackground === false && !ctrl.editMode}">

    <!-- Unconfigured state -->
    <div ng-if="!ctrl.widgetDef.config.feedUrl" class="dd-chart-unconfigured">
        <i class="fa-solid fa-rss"></i>
        <p>Enter a feed URL in settings</p>
    </div>

    <!-- Loading spinner -->
    <div ng-if="ctrl.widgetDef.config.feedUrl && ctrl.loading && !ctrl.items.length"
         class="dd-chart-unconfigured">
        <i class="fa-solid fa-spinner fa-spin"></i>
    </div>

    <!-- Error state -->
    <div ng-if="ctrl.loadError && !ctrl.loading" class="dd-chart-unconfigured">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <p>Could not load feed</p>
    </div>

    <!-- Single-item mode -->
    <div ng-if="ctrl.isSingleItem && ctrl.items.length && !ctrl.loadError">
        <div class="dd-rss-header">
            <span ng-bind="ctrl.feedTitle"></span>
        </div>
        <img ng-if="ctrl.widgetDef.config.showImages !== false && ctrl.items[0].thumbnail"
             ng-src="{{ctrl.items[0].thumbnail}}"
             class="dd-rss-single-img"
             alt="" />
        <div class="dd-rss-single-title">
            <a ng-href="{{ctrl.items[0].link}}"
               target="{{ctrl.linkTarget()}}"
               rel="noopener noreferrer"
               ng-bind="ctrl.items[0].title"></a>
        </div>
        <div class="dd-rss-single-excerpt"
             ng-bind="ctrl.items[0].description.substring(0, 150)"></div>
        <div ng-if="ctrl.widgetDef.config.showDate !== false"
             class="dd-rss-item-meta" style="margin-top: 6px;">
            <i class="fa-regular fa-clock"></i>
            {{ctrl.relativeTime(ctrl.items[0].pubDate)}}
            &nbsp;
            <a ng-href="{{ctrl.items[0].link}}"
               target="{{ctrl.linkTarget()}}"
               rel="noopener noreferrer"
               class="dd-rss-link-icon">
                <i class="fa-solid fa-arrow-up-right-from-square"></i>
            </a>
        </div>
    </div>

    <!-- Multi-item mode -->
    <div ng-if="!ctrl.isSingleItem && ctrl.widgetDef.config.feedUrl && !ctrl.loadError"
         style="height: 100%; display: flex; flex-direction: column;">
        <div class="dd-rss-header">
            <span ng-bind="ctrl.feedTitle"></span>
            <a ng-click="ctrl.load()" title="Refresh" style="cursor: pointer;">
                <i class="fa-solid fa-arrows-rotate"
                   ng-class="{'fa-spin': ctrl.loading}"></i>
            </a>
        </div>
        <div class="dd-rss-list">
            <div class="dd-rss-item" ng-repeat="item in ctrl.items">
                <img ng-if="ctrl.widgetDef.config.showImages !== false && item.thumbnail"
                     ng-src="{{item.thumbnail}}"
                     class="dd-rss-thumb"
                     alt="" />
                <div class="dd-rss-item-body">
                    <a ng-href="{{item.link}}"
                       target="{{ctrl.linkTarget()}}"
                       rel="noopener noreferrer"
                       class="dd-rss-item-title"
                       ng-bind="item.title"></a>
                    <div ng-if="ctrl.widgetDef.config.showDate !== false"
                         class="dd-rss-item-meta">
                        <i class="fa-regular fa-clock"></i>
                        {{ctrl.relativeTime(item.pubDate)}}
                    </div>
                </div>
                <a ng-href="{{item.link}}"
                   target="{{ctrl.linkTarget()}}"
                   rel="noopener noreferrer"
                   class="dd-rss-link-icon"
                   title="Open article">
                    <i class="fa-solid fa-arrow-up-right-from-square"></i>
                </a>
            </div>
            <div ng-if="!ctrl.items.length && !ctrl.loading"
                 class="dd-rss-item-meta" style="padding: 8px 0;">
                No items found
            </div>
        </div>
    </div>

</div>
