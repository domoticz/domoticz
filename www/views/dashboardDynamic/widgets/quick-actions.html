<div class="dd-quick-actions"
     ng-class="{'dd-quick-actions--list': ctrl.widgetDef.config.layout === true, 'dd-stat-card--no-bg': ctrl.widgetDef.config.showBackground === false && !ctrl.editMode}">

    <div ng-repeat="action in ctrl.actions" style="display:contents">

        <!-- Regular button: switch, scene -->
        <button class="dd-qa-btn"
                ng-if="action.type !== 'blind' && action.type !== 'selector' && action.type !== 'group' && action.type !== 'dimmer' && action.type !== 'security'"
                ng-click="ctrl.execute(action)"
                ng-class="{
                    'dd-qa-btn--scene':   action.type === 'scene',
                    'dd-qa-btn--switch':  action.type !== 'scene',
                    'dd-qa-btn--success': ctrl.success[ctrl.activeKey(action)],
                    'dd-qa-btn--error':   ctrl.error[ctrl.activeKey(action)],
                    'dd-qa-btn--busy':    ctrl.busy[ctrl.activeKey(action)]
                }"
                title="{{ action.label }}">
            <i ng-class="action.icon || 'fa-solid fa-play'"
               ng-style="ctrl.deviceOn[ctrl.activeKey(action)] ? {'color': 'var(--dz-accent-color)'} : {}"></i>
            <span class="dd-qa-label" ng-bind="action.label"></span>
        </button>

        <!-- Selector button + level picker -->
        <div class="dd-qa-selector-group" ng-if="action.type === 'selector'" style="display:contents">
            <button class="dd-qa-btn dd-qa-btn--selector"
                    ng-click="ctrl.toggleLevelPicker(action.idx, $event)"
                    ng-class="{
                        'dd-qa-btn--success': ctrl.success[action.idx + '_sel'],
                        'dd-qa-btn--error':   ctrl.error[action.idx + '_sel'],
                        'dd-qa-btn--busy':    ctrl.busy[action.idx + '_sel']
                    }"
                    title="{{ action.label }}">
                <i ng-class="action.icon || 'fa-solid fa-sliders'"></i>
                <span class="dd-qa-label" ng-bind="action.label"></span>
                <span class="dd-qa-level-text" ng-bind="ctrl.currentLevelText[action.idx]"></span>
            </button>
            <div class="dd-qa-level-picker"
                 ng-show="ctrl.showLevelPicker[action.idx]"
                 ng-click="$event.stopPropagation()">
                <button class="dd-qa-level-btn"
                        ng-repeat="opt in ctrl.levelOptions[action.idx]"
                        ng-click="ctrl.selectLevel(action, opt.value)"
                        ng-class="{'dd-qa-level-btn--active': ctrl.currentLevel[action.idx] === opt.value}">
                    {{ opt.label }}
                </button>
            </div>
        </div>

        <!-- Dimmer button group: sliders icon + toggle -->
        <div class="dd-qa-dimmer-group" ng-if="action.type === 'dimmer'">
            <span class="dd-qa-label" ng-bind="action.label"></span>
            <div class="dd-qa-dimmer-controls">
                <button class="dd-qa-btn dd-qa-btn--dim-slider"
                        ng-click="ctrl.toggleDimSlider(action.idx, $event)"
                        title="Set dim level">
                    <i class="fa-solid fa-sliders"
                       ng-style="ctrl.showDimSlider[action.idx] ? {'color': 'var(--dz-accent-color)'} : {}"></i>
                </button>
                <button class="dd-qa-btn dd-qa-btn--dim-toggle"
                        ng-click="ctrl.execute(action)"
                        ng-class="{
                            'dd-qa-btn--success': ctrl.success[action.idx],
                            'dd-qa-btn--error':   ctrl.error[action.idx],
                            'dd-qa-btn--busy':    ctrl.busy[action.idx]
                        }"
                        title="{{ action.label }}">
                    <i ng-class="action.icon || 'fa-solid fa-power-off'"
                       ng-style="ctrl.deviceOn[action.idx] ? {'color': 'var(--dz-accent-color)'} : {}"></i>
                </button>
            </div>
            <div class="dd-qa-dim-slider-row"
                 ng-show="ctrl.showDimSlider[action.idx]"
                 ng-click="$event.stopPropagation()">
                <input type="range"
                       class="dd-qa-dim-range-h"
                       min="0" max="100" step="5"
                       ng-model="ctrl.dimLevel[action.idx]"
                       ng-mouseup="ctrl.applyDimLevel(action)"
                       ng-touchend="ctrl.applyDimLevel(action)">
                <span class="dd-qa-dim-value-text">{{ ctrl.dimLevel[action.idx] }}%</span>
            </div>
        </div>

        <!-- Group button group (On/Off) -->
        <div class="dd-qa-group-group" ng-if="action.type === 'group'">
            <span class="dd-qa-label" ng-bind="action.label"></span>
            <div class="dd-qa-group-btns">
                <button class="dd-qa-btn dd-qa-btn--group"
                        ng-click="ctrl.execute(action, 'On')"
                        ng-class="{
                            'dd-qa-btn--success': ctrl.success[action.idx + '_On'],
                            'dd-qa-btn--error':   ctrl.error[action.idx + '_On'],
                            'dd-qa-btn--busy':    ctrl.busy[action.idx + '_On']
                        }"
                        title="On">
                    <i class="fa-solid fa-power-off"
                       ng-style="ctrl.deviceOn[action.idx] ? {'color': 'var(--dz-accent-color)'} : {}"></i>
                </button>
                <button class="dd-qa-btn dd-qa-btn--group"
                        ng-click="ctrl.execute(action, 'Off')"
                        ng-class="{
                            'dd-qa-btn--success': ctrl.success[action.idx + '_Off'],
                            'dd-qa-btn--error':   ctrl.error[action.idx + '_Off'],
                            'dd-qa-btn--busy':    ctrl.busy[action.idx + '_Off']
                        }"
                        title="Off">
                    <i class="fa-solid fa-power-off"
                       ng-style="!ctrl.deviceOn[action.idx] ? {'color': 'var(--dz-accent-color)'} : {}"></i>
                </button>
            </div>
        </div>

        <!-- Blind button group -->
        <div class="dd-qa-blind-group" ng-if="action.type === 'blind'">
            <span class="dd-qa-label" ng-bind="action.label"></span>
            <div class="dd-qa-blind-btns">
                <button class="dd-qa-btn dd-qa-btn--blind"
                        ng-click="ctrl.execute(action, 'Open')"
                        ng-class="{
                            'dd-qa-btn--success': ctrl.success[action.idx + '_Open'],
                            'dd-qa-btn--error':   ctrl.error[action.idx + '_Open'],
                            'dd-qa-btn--busy':    ctrl.busy[action.idx + '_Open']
                        }"
                        title="Open">
                    <i class="fa-solid fa-chevron-up"
                       ng-style="ctrl.blindStatus[action.idx] === 'open' ? {'color': 'var(--dz-accent-color)'} : {}"></i>
                </button>
                <button class="dd-qa-btn dd-qa-btn--blind dd-qa-btn--stop"
                        ng-if="action.hasStop"
                        ng-click="ctrl.execute(action, 'Stop')"
                        ng-class="{
                            'dd-qa-btn--success': ctrl.success[action.idx + '_Stop'],
                            'dd-qa-btn--error':   ctrl.error[action.idx + '_Stop'],
                            'dd-qa-btn--busy':    ctrl.busy[action.idx + '_Stop']
                        }"
                        title="Stop">
                    <i class="fa-solid fa-stop"
                       ng-style="ctrl.blindStatus[action.idx] === 'stopped' ? {'color': 'var(--dz-accent-color)'} : {}"></i>
                </button>
                <button class="dd-qa-btn dd-qa-btn--blind"
                        ng-click="ctrl.execute(action, 'Close')"
                        ng-class="{
                            'dd-qa-btn--success': ctrl.success[action.idx + '_Close'],
                            'dd-qa-btn--error':   ctrl.error[action.idx + '_Close'],
                            'dd-qa-btn--busy':    ctrl.busy[action.idx + '_Close']
                        }"
                        title="Close">
                    <i class="fa-solid fa-chevron-down"
                       ng-style="ctrl.blindStatus[action.idx] === 'closed' ? {'color': 'var(--dz-accent-color)'} : {}"></i>
                </button>
            </div>
        </div>

        <!-- Security Panel button group -->
        <div class="dd-qa-security-group" ng-if="action.type === 'security'">
            <span class="dd-qa-label" ng-bind="action.label"></span>
            <div class="dd-qa-security-btns">
                <button class="dd-qa-btn dd-qa-btn--security"
                        ng-click="ctrl.execute(action, 0)"
                        ng-class="{
                            'dd-qa-btn--success': ctrl.success[action.idx + '_sec_0'],
                            'dd-qa-btn--error':   ctrl.error[action.idx + '_sec_0'],
                            'dd-qa-btn--busy':    ctrl.busy[action.idx + '_sec_0']
                        }"
                        title="Disarm">
                    <i class="fa-solid fa-shield-xmark"
                       ng-style="ctrl.securityStatus[action.idx] === 'Normal' ? {'color': 'var(--dz-accent-color)'} : {}"></i>
                </button>
                <button class="dd-qa-btn dd-qa-btn--security"
                        ng-click="ctrl.execute(action, 1)"
                        ng-class="{
                            'dd-qa-btn--success': ctrl.success[action.idx + '_sec_1'],
                            'dd-qa-btn--error':   ctrl.error[action.idx + '_sec_1'],
                            'dd-qa-btn--busy':    ctrl.busy[action.idx + '_sec_1']
                        }"
                        title="Arm Home">
                    <i class="fa-solid fa-house-lock"
                       ng-style="ctrl.securityStatus[action.idx] === 'Arm Home' ? {'color': 'var(--dz-accent-color)'} : {}"></i>
                </button>
                <button class="dd-qa-btn dd-qa-btn--security"
                        ng-click="ctrl.execute(action, 2)"
                        ng-class="{
                            'dd-qa-btn--success': ctrl.success[action.idx + '_sec_2'],
                            'dd-qa-btn--error':   ctrl.error[action.idx + '_sec_2'],
                            'dd-qa-btn--busy':    ctrl.busy[action.idx + '_sec_2']
                        }"
                        title="Arm Away">
                    <i class="fa-solid fa-shield"
                       ng-style="ctrl.securityStatus[action.idx] === 'Arm Away' ? {'color': 'var(--dz-accent-color)'} : {}"></i>
                </button>
            </div>
        </div>

    </div>

    <div class="dd-qa-empty"
         ng-show="ctrl.actions.length === 0">
        <i class="fa-solid fa-bolt" style="opacity:0.3;font-size:24px"></i>
        <p>Configure actions in widget settings</p>
    </div>
</div>
