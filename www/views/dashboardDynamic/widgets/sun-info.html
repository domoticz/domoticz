<div class="dd-sun">
    <div class="dd-sun-cols">
        <div class="dd-sun-col">
            <i class="fa-solid fa-sun dd-sun-icon dd-sun-icon-rise"></i>
            <div class="dd-sun-label">Sunrise</div>
            <div class="dd-sun-time" ng-bind="ctrl.sunrise"></div>
        </div>
        <div class="dd-sun-divider"></div>
        <div class="dd-sun-col">
            <i class="fa-solid fa-moon dd-sun-icon dd-sun-icon-set"></i>
            <div class="dd-sun-label">Sunset</div>
            <div class="dd-sun-time" ng-bind="ctrl.sunset"></div>
        </div>
    </div>
    <div class="dd-sun-daylength text-muted">
        Day length: {{ ctrl.daylength }}
    </div>
</div>
