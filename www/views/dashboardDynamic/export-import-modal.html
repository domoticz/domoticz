<div class="modal-header">
    <button type="button" class="close" ng-click="cancel()">&times;</button>
    <h4 class="modal-title">
        <i class="fa-solid fa-arrow-right-arrow-left" style="margin-right:6px"></i>
        Export / Import Dashboard
    </h4>
</div>

<div class="modal-body dd-eim-body">
    <!-- Top-level tabs: Export / Import -->
    <ul class="nav nav-tabs sub-tabs dd-eim-tabs">
        <li ng-class="{active: tab === 'export'}">
            <a href ng-click="tab = 'export'">
                <i class="fa-solid fa-file-export"></i> Export
            </a>
        </li>
        <li ng-class="{active: tab === 'import'}">
            <a href ng-click="tab = 'import'">
                <i class="fa-solid fa-file-import"></i> Import
            </a>
        </li>
    </ul>

    <!-- EXPORT PANEL -->
    <div ng-show="tab === 'export'" class="dd-eim-panel" ng-init="buildExportJson()">
        <textarea class="form-control dd-eim-textarea" readonly
                  ng-model="exportJson"
                  ng-click="$event.target.select()"></textarea>
        <div class="dd-eim-actions">
            <button class="btn btn-sm btn-default"
                    ng-click="downloadFile()">
                <i class="fa-solid fa-download"></i> Download
            </button>
            <button class="btn btn-sm"
                    ng-class="copied ? 'btn-success' : 'btn-primary'"
                    ng-click="copyToClipboard()">
                <i ng-class="copied ? 'fa-solid fa-check' : 'fa-solid fa-copy'"></i>
                {{ copied ? 'Copied!' : 'Copy to clipboard' }}
            </button>
        </div>
    </div>

    <!-- IMPORT PANEL -->
    <div ng-show="tab === 'import'" class="dd-eim-panel">
        <textarea class="form-control dd-eim-textarea"
                  placeholder="Paste dashboard JSON here, or drop a .json file..."
                  ng-model="importJson"
                  ng-change="validateImportJson()"
                  ng-class="{'dd-eim-textarea--drag': dropHover}"
                  dd-file-drop
                  on-drop="onFileDrop($file)"></textarea>

        <!-- File drop zone -->
        <div class="dd-eim-dropzone"
             ng-class="{'dd-eim-dropzone--hover': dropHover}"
             dd-file-drop
             on-drop="onFileDrop($file)"
             ng-click="triggerFilePick()">
            <i class="fa-solid fa-file-arrow-up"></i>
            <span>Drop a <code>.json</code> file here or click to browse</span>
            <input type="file" id="dd-eim-file" accept=".json" style="display:none"
                   dd-file-import="onFileSelected($file)">
        </div>

        <!-- Validation feedback -->
        <div class="alert alert-warning dd-eim-warning" ng-show="versionWarning">
            <i class="fa-solid fa-triangle-exclamation"></i> {{ versionWarning }}
        </div>
        <div class="alert alert-danger dd-eim-warning" ng-show="importError">
            <i class="fa-solid fa-circle-exclamation"></i> {{ importError }}
        </div>

        <!-- Import target -->
        <div class="dd-eim-row dd-eim-target-row">
            <span class="dd-eim-target-label">Import to:</span>
            <label class="dd-eim-radio">
                <input type="radio" ng-model="importTarget" value="new"> New dashboard
            </label>
            <label class="dd-eim-radio">
                <input type="radio" ng-model="importTarget" value="replace"> Replace current
            </label>
        </div>

        <!-- Name input for new dashboard -->
        <div class="dd-eim-row" ng-show="importTarget === 'new'">
            <input type="text" class="form-control input-sm"
                   placeholder="Dashboard name"
                   ng-model="importNewName">
        </div>
    </div>
</div>

<div class="modal-footer">
    <button type="button" class="btn btn-default" ng-click="cancel()">Cancel</button>
    <button type="button" class="btn btn-primary"
            ng-show="tab === 'import'"
            ng-disabled="!canImport()"
            ng-click="doImport()">
        <i class="fa-solid fa-file-import"></i> Import
    </button>
</div>
