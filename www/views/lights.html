<div class="container">
	<gz-back-to-top></gz-back-to-top>
	<div ng-include="'views/inc_topbar.html'"></div>

	<div id="lightcontent" class="devicesList">
		<div id="lightlist" ng-show="showLightList">
			<div class="row">
				<dz-light-widget ng-repeat="device in devices track by device.idx"
					device="device"
					view-mode="tab"
					on-update="refreshLights()">
				</dz-light-widget>
			</div>
			<h2 ng-if="!loading && devices.length === 0" data-i18n="No Lights/Switches found or added in the system...">No Lights/Switches found or added in the system...</h2>
		</div>
	</div>
</div>
