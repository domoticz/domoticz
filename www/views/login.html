<style>
	#canvas-login {
		position: fixed;
		top: 0;
		left: 0;
		width: 100%;
		height: 100%;
		z-index: -1;
	}
	body, #foreground, #midground {
		background: none;
	}

	/* Login-specific styles (shared glass styles are in css/style.css) */
	.login-title {
		font-size: 2em;
		font-weight: 300;
		color: #fff;
		text-shadow: 0 0 30px rgba(100, 200, 255, 0.5);
		margin-bottom: 6px;
		letter-spacing: 3px;
	}

	.login-logo {
		width: 57px;
		height: 57px;
		margin-bottom: 10px;
	}

	.auth-tabs {
		display: flex;
		gap: 8px;
		margin-bottom: 20px;
		border-bottom: 1px solid rgba(255, 255, 255, 0.1);
		padding-bottom: 12px;
	}

	.auth-tab {
		flex: 1;
		padding: 8px 12px;
		background: rgba(255, 255, 255, 0.05);
		border: 1px solid rgba(255, 255, 255, 0.1);
		border-radius: 8px;
		color: rgba(255, 255, 255, 0.6);
		font-size: 0.9em;
		cursor: pointer;
		transition: all 0.3s ease;
		text-align: center;
	}

	.auth-tab.active {
		background: rgba(100, 200, 255, 0.2);
		border-color: rgba(100, 200, 255, 0.5);
		color: #fff;
	}

	.auth-tab:hover:not(.active) {
		background: rgba(255, 255, 255, 0.1);
		color: rgba(255, 255, 255, 0.85);
	}

	.remember-row {
		display: flex;
		align-items: center;
		gap: 8px;
		margin-bottom: 16px;
		color: rgba(255, 255, 255, 0.7);
		font-size: 0.9em;
	}

	.remember-row input[type="checkbox"] {
		accent-color: rgba(100, 200, 255, 0.8);
		width: 16px;
		height: 16px;
		cursor: pointer;
	}

	.remember-row label {
		cursor: pointer;
	}

	.totp-input {
		text-align: center;
		letter-spacing: 0.5em;
		font-size: 1.4em;
		font-family: 'Courier New', monospace;
	}

	@keyframes shake {
		0%, 100% { transform: translateX(0); }
		20%, 60% { transform: translateX(-8px); }
		40%, 80% { transform: translateX(8px); }
	}

	.shake {
		animation: shake 0.4s ease-in-out;
	}

	.back-link {
		display: block;
		text-align: center;
		margin-top: 12px;
		color: rgba(100, 200, 255, 0.8);
		font-size: 0.9em;
		cursor: pointer;
		text-decoration: none;
		transition: color 0.2s ease;
	}

	.back-link:hover {
		color: rgba(100, 200, 255, 1);
		text-decoration: underline;
	}

	.passkey-icon {
		font-size: 2em;
		margin-bottom: 10px;
		color: rgba(100, 200, 255, 0.8);
	}

	.passkey-desc {
		color: rgba(255, 255, 255, 0.65);
		font-size: 0.9em;
		margin-bottom: 16px;
		line-height: 1.5;
	}

	.domoticz-link {
		display: block;
		text-align: center;
		margin-top: 16px;
		color: rgba(100, 200, 255, 0.6);
		font-size: 0.85em;
		text-decoration: none;
	}

	.domoticz-link:hover {
		color: rgba(100, 200, 255, 0.9);
	}

	/* Instant hide when switching views - prevent ngAnimate from
	   waiting for the fadeInUp animation to finish before hiding */
	.glass-card.ng-hide-add {
		animation: none !important;
	}
</style>

<canvas id="canvas-login"></canvas>

<div class="glass-container">
	<center>

		<!-- Login view -->
		<div ng-show="authView === 'login'" class="glass-card" style="max-width: 380px; animation-delay: 0s;">
			<img class="login-logo" src="images/logo/57.png" alt="Domoticz">
			<h1 class="login-title">Domoticz</h1>

			<!-- Auth method tabs (shown only when passkeys are available) -->
			<div class="auth-tabs" ng-show="passkeyAvailable">
				<div class="auth-tab" ng-class="{'active': authMethod === 'password'}" ng-click="setAuthMethod('password')" data-i18n="Password">Password</div>
				<div class="auth-tab" ng-class="{'active': authMethod === 'passkey'}" ng-click="setAuthMethod('passkey')" data-i18n="Passkey">Passkey</div>
			</div>

			<!-- Password login form -->
			<form name="login-form" ng-show="authMethod === 'password'" ng-submit="DoLogin()" form-autofill-fix>
				<input type="text" id="username" name="username" class="glass-input" autocapitalize="none" autocorrect="off" placeholder="Username" autofocus ng-required>
				<input type="password" id="password" name="password" class="glass-input" placeholder="Password" ng-required>
				<div class="remember-row">
					<input type="checkbox" id="rememberme">
					<label for="rememberme" id="remembermelbl" data-i18n="Remember me">Remember me</label>
				</div>
				<button type="submit" class="btn-modern" style="width: 100%; padding: 12px;" data-i18n="Login">Login</button>
			</form>

			<!-- Passkey login -->
			<div ng-show="authMethod === 'passkey'">
				<div class="passkey-icon">&#128273;</div>
				<p class="passkey-desc" data-i18n="Use your device passkey to sign in securely without a password.">Use your device passkey to sign in securely without a password.</p>
				<button class="btn-modern" style="width: 100%; padding: 12px;" ng-click="DoPasskeyLogin()" data-i18n="Sign in with Passkey">Sign in with Passkey</button>
			</div>

			<a class="domoticz-link" href="http://www.domoticz.com">www.domoticz.com</a>
		</div>

		<!-- 2FA view -->
		<div id="2fa-card" ng-show="authView === '2fa'" class="glass-card" style="max-width: 380px; animation-delay: 0s;">
			<i class="fas fa-shield-alt passkey-icon"></i>
			<h3 class="section-title" data-i18n="Two-Factor Authentication">Two-Factor Authentication</h3>
			<p class="glass-text" data-i18n="Enter the 6 digit 2FA code">Enter the 6 digit 2FA code</p>
			<form name="mfa-form" ng-submit="DoMfaLogin()" form-autofill-fix>
				<input type="text" id="totp" name="totp" class="glass-input totp-input" autocomplete="one-time-code" inputmode="numeric" placeholder="000000" maxlength="6" ng-keyup="watchTotp()" ng-required>
				<button type="submit" class="btn-modern" style="width: 100%; padding: 12px;" data-i18n="Verify">Verify</button>
			</form>
			<a class="back-link" ng-click="backToLogin()"><i class="fas fa-arrow-left" style="margin-right: 6px;"></i><span data-i18n="Back to Login">Back to Login</span></a>
			<a class="domoticz-link" href="http://www.domoticz.com">www.domoticz.com</a>
		</div>

	</center>
</div>
