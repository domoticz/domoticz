<uv-current-conditions
        device="::$ctrl.device">
</uv-current-conditions>
<uv-short-chart
        class="device-log-chart"
        device="::$ctrl.device"></uv-short-chart>
<br/>
<uv-long-chart
        class="device-log-chart"
        device="::$ctrl.device"
        range="month"></uv-long-chart>
<br/>
<uv-long-chart
        class="device-log-chart"
        device="::$ctrl.device"
        range="year"></uv-long-chart>
<br/>
<uv-compare-chart
        class="device-log-chart"
        device="::$ctrl.device"
        range="compare">
</uv-compare-chart>
