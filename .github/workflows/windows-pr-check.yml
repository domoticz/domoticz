name: PR Check (Windows)

concurrency:
  group: windows-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - development
      - master
    paths-ignore:
      - 'tools/**'
      - '**.md'
      - '**.txt'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  windows:
    runs-on: windows-2022

    if: github.repository == 'domoticz/domoticz'

    env:
      CONFIGURATION: Release
      PLATFORM: x86

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      # update submodules to the latest upstream commit on each
      # configured tracking branch, so new library fixes are picked up automatically.
      - name: Update submodules to latest upstream
        run: git submodule update --init --remote --force

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1.3

      - name: Download WindowsLibraries
        shell: powershell
        run: |
          cd msbuild
          Invoke-WebRequest `
            -Uri "https://raw.githubusercontent.com/domoticz/win32-libraries/master/WindowsLibraries.7z" `
            -OutFile "WindowsLibraries.7z"
          7z x WindowsLibraries.7z | Out-Null
          cd ..

      - name: Configure libwebem build paths
        shell: powershell
        run: |
          $propsContent = @"
          <Project>
            <ItemDefinitionGroup>
              <ClCompile>
                <AdditionalIncludeDirectories>${{ github.workspace }}\msbuild\Windows Libraries\include;%(AdditionalIncludeDirectories)</AdditionalIncludeDirectories>
              </ClCompile>
            </ItemDefinitionGroup>
          </Project>
          "@
          $propsContent | Out-File -FilePath "extern\libwebem\Directory.Build.props" -Encoding utf8

      - name: Build Domoticz
        shell: cmd
        run: msbuild msbuild\domoticz.sln /m /p:Configuration=%CONFIGURATION% /p:Platform=%PLATFORM% /verbosity:minimal
