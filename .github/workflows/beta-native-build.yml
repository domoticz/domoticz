name: Beta native builds

# Runs the native build chain on the self-hosted build infrastructure:
# raspb5 builds armv7l and aarch64 in schroots, then triggers the x86_64
# build and the docker image on the intel machine via domake.sh.

# Gated on the GitHub-hosted CI build: the native builders only start after
# the x86_64 compile check on GitHub succeeded, so broken commits never
# occupy the build machines or produce a broken beta upload.
on:
  workflow_run:
    workflows: ["Domoticz Development (Beta) Unix"]
    types: [completed]
    branches:
      - development

  # Allows this workflow to be started manually from the Actions tab,
  # bypassing the CI gate
  workflow_dispatch:

concurrency:
  group: beta-native
  cancel-in-progress: false

jobs:
  build-all:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, raspb5]
    timeout-minutes: 360
    steps:
      - name: Build all architectures and docker image
        run: ~/domake.sh beta force
